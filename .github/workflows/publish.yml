name: publish-ghcr

# 触发：推送 Stateless+* 分支（GitHub 会规范化分支拼写，用通配符兼容）/ 打 v* 标签 / 手动触发
on:
  push:
    branches:
      - 'Stateless+*'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ghcr 镜像名必须全小写。GitHub Actions 表达式没有 lower() 函数，
  # 因此直接硬编码小写镜像名（避免 workflow 校验失败）。
  IMAGE_NAME: nickshee/obsidian-mcp-pro

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=stateless-heartbeat,enable=${{ github.ref == 'refs/heads/Stateless+HearBeat' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/Stateless+HearBeat' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # workflow 推送的包会自动关联仓库，GITHUB_TOKEN 因此有 admin 权限，
      # 可以直接把首次发布的私有包改为公开。
      - name: Make package public
        run: |
          gh api --method PATCH "/user/packages/container/${{ github.event.repository.name }}" \
            -f visibility=public \
            || echo "note: 若此步失败，请在 GitHub Packages 页面手动将可见性改为 public"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
