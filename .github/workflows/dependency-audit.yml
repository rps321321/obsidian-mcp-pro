name: Dependency audit probe

on:
  push:
    branches:
      - rps/dependency-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vulnerable dependency chains
        run: npm ls @hono/node-server body-parser fast-uri hono ip-address js-yaml qs brace-expansion nanoid postcss --all || true
      - name: Semver-safe audit fix dry run
        run: npm audit fix --package-lock-only --dry-run --json || true
      - name: Production dependency audit
        run: npm audit --omit=dev --json || true
      - name: Full dependency audit
        run: npm audit --json || true
