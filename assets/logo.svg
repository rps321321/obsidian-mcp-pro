<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0420"/>
      <stop offset="1" stop-color="#2D1B69"/>
    </linearGradient>
    <linearGradient id="gem" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9D5FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)" rx="200" ry="200"/>
  <circle cx="512" cy="512" r="380" fill="url(#glow)"/>

  <g transform="translate(512 512)" filter="url(#softShadow)">
    <polygon points="0,-300 270,-30 0,300 -270,-30" fill="url(#gem)" stroke="#E9D5FF" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="0,-300 -100,-60 0,-30 100,-60" fill="url(#facet)" opacity="0.85"/>
    <polygon points="-270,-30 -100,-60 0,-30 -180,140" fill="#5B21B6" opacity="0.55"/>
    <polygon points="270,-30 100,-60 0,-30 180,140" fill="#5B21B6" opacity="0.35"/>
    <polygon points="0,-30 -180,140 0,300 180,140" fill="#4C1D95" opacity="0.5"/>
    <line x1="0" y1="-300" x2="0" y2="-30" stroke="#F5F3FF" stroke-width="2" opacity="0.7"/>
    <line x1="-270" y1="-30" x2="0" y2="-30" stroke="#F5F3FF" stroke-width="2" opacity="0.5"/>
    <line x1="270" y1="-30" x2="0" y2="-30" stroke="#F5F3FF" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="-30" x2="0" y2="300" stroke="#F5F3FF" stroke-width="2" opacity="0.4"/>

    <g>
      <line x1="-110" y1="60" x2="110" y2="60" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
      <line x1="-110" y1="60" x2="0" y2="190" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
      <line x1="110" y1="60" x2="0" y2="190" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
      <circle cx="-110" cy="60" r="22" fill="#FBBF24" stroke="#FFFBEB" stroke-width="3"/>
      <circle cx="110" cy="60" r="22" fill="#FBBF24" stroke="#FFFBEB" stroke-width="3"/>
      <circle cx="0" cy="190" r="22" fill="#FBBF24" stroke="#FFFBEB" stroke-width="3"/>
    </g>

    <polygon points="-90,-180 -50,-160 -55,-115 -100,-130" fill="#F5F3FF" opacity="0.35"/>
  </g>
</svg>
